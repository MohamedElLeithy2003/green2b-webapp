{% extends "base.html" %}
{% block title %}Edit Product | Green 2B{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <h2 class="text-center mb-4">Edit Product</h2>
    <form method="POST" action="{{ url_for('edit_product', product_id=product.id) }}" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Product Name:</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required />

            <label for="category">Category:</label>
            <select id="category" name="category" class="form-control" required>
                <option value="" disabled>Select category</option>
                <option value="eco-friendly" {% if product.category == 'eco-friendly' %}selected{% endif %}>Eco-Friendly</option>
                <option value="organic" {% if product.category == 'organic' %}selected{% endif %}>Organic</option>
                <option value="recycled" {% if product.category == 'recycled' %}selected{% endif %}>Recycled</option>
            </select>

            <label for="price">Price:</label>
            <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ product.price }}" required />

            <label for="impact">Sustainability Impact:</label>
            <textarea id="impact" name="impact" class="form-control" rows="3" required>{{ product.impact }}</textarea>
            <label for="image">Product Image:</label>
            <input type="file" id="image" name="image" accept="image/*" class="form-control-file" style="margin-bottom: 1rem;">

            {% if product.image_url %}
                <img id="image-preview" src="{{ product.image_url }}" alt="Image Preview" style="display: block; max-width: 100%; margin-top: 10px; border-radius: 5px;">
            {% else %}
                <img id="image-preview" src="#" alt="Image Preview" style="display: none; max-width: 100%; margin-top: 10px; border-radius: 5px;">
            {% endif %}

            <button type="submit" class="btn btn-primary btn-block mt-3">Save Changes</button>
            <a href="{{ url_for('supplier_products') }}" class="btn btn-secondary btn-block mt-2">Cancel</a>
            </div>
    </form>
    <script>
        const imageInput = document.getElementById('image');
        const imagePreview = document.getElementById('image-preview');

        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.setAttribute('src', e.target.result);
                    imagePreview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            } else {
                imagePreview.style.display = 'none';
                imagePreview.setAttribute('src', '');
            }
        });
    </script>
</div>
{% endblock %}
