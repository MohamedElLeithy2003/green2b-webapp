{% extends "admin_base.html" %}

{% block title %}Product Details - Green2B{% endblock %}
{% block header_title %}Product Details{% endblock %}

{% block content %}
<h2>Product: {{ product.name|default('Unnamed Product') }}</h2>

<form method="POST" id="product-form">
    <label>Name</label>
    <input type="text" name="name" value="{{ product.name|default('') }}">

    <label>Description</label>
    <textarea name="description">{{ product.description|default('') }}</textarea>

    <label>Price</label>
    <input type="text" name="price" value="{{ product.price|default('') }}">

    <label>Category</label>
    <input type="text" name="category" value="{{ product.category|default('') }}">

    <label>Image URL</label>
    <input type="text" name="image_url" value="{{ product.image_url|default('') }}">
    {% if product.image_url %}
        <img src="{{ product.image_url }}" alt="Product Image" class="preview" />
    {% endif %}

    <label>Status</label>
    <input type="text" value="{{ product.status|default('Pending')|capitalize }}" disabled class="readonly">

    <div class="buttons">
        <button type="submit" id="saveBtn" class="btn btn-success">Save Changes</button>
        <a href="{{ url_for('admin.admin_products') }}" class="btn btn-secondary">Back to Products</a>
    </div>
</form>

<!-- Request Changes to Supplier -->
<form method="POST" action="{{ url_for('admin.request_change', product_id=product.id|default('')) }}" style="margin-top: 2rem;">
    <textarea name="change_note" placeholder="Describe changes needed..." required style="width:100%; height:100px;"></textarea>
    <br>
    <button type="submit" class="btn btn-warning">Request Changes</button>
</form>

<!-- Delete Product -->
<form method="POST" action="{{ url_for('admin.remove_product', product_id=product.id|default('')) }}" 
      onsubmit="return confirm('Are you sure you want to delete this product?');" 
      style="margin-top: 1rem;">
    <button type="submit" class="btn btn-danger">Delete Product</button>
</form>

<style>
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    textarea { resize: vertical; min-height: 80px; }
    .buttons { margin-top: 20px; display: flex; gap: 10px; }
    img.preview { max-height: 200px; margin-top: 10px; }
    .readonly { background: #f3f3f3; border: 1px solid #ccc; }
    .btn { padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
    .btn-success { background-color: #198754; color: white; border: none; }
    .btn-secondary { background-color: #6c757d; color: white; border: none; }
    .btn-warning { background-color: #ffc107; color: black; border: none; }
    .btn-danger { background-color: #dc3545; color: white; border: none; }
</style>
{% endblock %}
