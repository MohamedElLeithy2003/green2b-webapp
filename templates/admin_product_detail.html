<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Product Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e9f5ec;
            margin: 0;
            padding: 0;
        }
        .dashboard-header {
            background-color: #4CAF50;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dashboard-header h1 {
            margin: 0;
        }
        .dashboard-header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .dashboard-content {
            padding: 2rem;
        }
        .section {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }
        .section h2 {
            margin-top: 0;
        }
        nav {
            margin-bottom: 1rem;
            color: #4CAF50;
        }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    textarea { resize: vertical; min-height: 80px; }
    .buttons { margin-top: 20px; }
    .hidden { display: none; }
    img.preview { max-height: 200px; margin-top: 10px; }
    .readonly { background: #f3f3f3; border: 1px solid #ccc; }
  </style>
  <script>
    function toggleEdit() {
        const form = document.getElementById('product-form');
        const view = document.getElementById('product-view');
        form.classList.toggle('hidden');
        view.classList.toggle('hidden');
    }

    function previewImage(event) {
        const preview = document.getElementById('image-preview');
        preview.src = URL.createObjectURL(event.target.files[0]);
        preview.classList.remove('hidden');
    }
    </script>
</head>
</body>
<h2> Product: {{ product.name }} </h2>
<form method="POST">
    <label>Name</label>
    <input class="editable readonly" type="text" name="name" value="{{ product.name }}" disabled>

    <label>Description</label>
    <textarea class="editable readonly" name="description" disabled>{{ product.description }}</textarea>

    <label>Price</label>
    <input class="editable readonly" type="text" name="price" value="{{ product.price }}" disabled>

    <label>Category</label>
    <input class="editable readonly" type="text" name="category" value="{{ product.category }}" disabled>

    <label>Image URL</label>
    <input class="editable readonly" type="text" name="image_url" value="{{ product.image_url }}" disabled>
    {% if product.image_url %}
      <img src="{{ product.image_url }}" alt="Product Image" class="preview" />
    {% endif %}

    <label>Status</label>
    <input type="text" value="{{ product.status|capitalize }}" disabled class="readonly">

    <div class="buttons">
      <button type="button" onclick="toggleEdit()">Edit</button>
      <button type="submit" id="saveBtn" class="hidden">Save Changes</button>
    </div>
  </form>
    <form method="POST" action="{{ url_for('admin.request_change', product_id=product.id) }}">
        <textarea name="change_note" placeholder="Describe changes needed..." required style="width:100%; height:100px;"></textarea>
        <br>
        <button type="submit" class="btn btn-warning">Request Changes</button>
    </form>

    <!-- Delete Product -->
    <form method="POST" action="{{ url_for('admin.remove_product', product_id=product.id) }}" onsubmit="return confirm('Are you sure you want to delete this product?');">
        <button type="submit" class="btn btn-danger mt-2">Delete Product</button>
    </form>
</body>
</html>
