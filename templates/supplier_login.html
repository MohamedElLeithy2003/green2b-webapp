{% extends "base.html" %}

{% block title %} Supplier Login | Green 2B{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <h2 class="text-center mb-4">Supplier Login</h2>
    <form method="POST" action="/supplier_login">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
        <p class="text-center mt-3">Don't have an account? <a href="{{ url_for('supplier_register') }}">Register here</a></p>
    </form>
</div>
{% endblock %}
