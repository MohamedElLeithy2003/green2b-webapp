{% extends "supplier_base.html" %}
{% block title %} Edit Product | Green2B {% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 2rem auto; padding: 2rem; background: #f9f9f9; border-radius: 8px;">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Edit Product</h2>
    <form method="POST" action="{{ url_for('edit_product', product_id=product.id) }}" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1rem;">

        <div style="display: flex; flex-direction: column;">
            <label for="name">Product Name</label>
            <input type="text" id="name" name="name" value="{{ product.name }}" required />
        </div>

        <div style="display: flex; flex-direction: column;">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="" disabled>Select category</option>
                <option value="eco-friendly" {% if product.category == 'eco-friendly' %}selected{% endif %}>Eco-Friendly</option>
                <option value="organic" {% if product.category == 'organic' %}selected{% endif %}>Organic</option>
                <option value="recycled" {% if product.category == 'recycled' %}selected{% endif %}>Recycled</option>
            </select>
        </div>

        <div style="display: flex; flex-direction: column;">
            <label for="price">Price</label>
            <input type="number" step="0.01" id="price" name="price" value="{{ product.price }}" required />
        </div>

        <div style="display: flex; flex-direction: column;">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4">{{ product.description or '' }}</textarea>
        </div>

        <div style="display: flex; flex-direction: column;">
            <label for="impact">Sustainability Impact</label>
            <textarea id="impact" name="impact" placeholder="Describe the sustainability impact" rows="3">{{ product.impact }}</textarea>
        </div>

        <div style="display: flex; flex-direction: column;">
            <label for="image">Product Image</label>
            <input type="file" id="image" name="image" accept="image/*" />
            {% if product.image_url %}
                <img id="image-preview"
                     src="{{ url_for('static', filename=product.image_url.split('static/')[1]) }}"
                     alt="Image Preview"
                     style="max-width: 100%; margin-top: 10px; border-radius: 5px;" />
            {% else %}
                <img id="image-preview"
                     src="#"
                     alt="Image Preview"
                     style="display: none; max-width: 100%; margin-top: 10px; border-radius: 5px;" />
            {% endif %}
        </div>

        <button type="submit"
                style="background-color: #095c43; color: white; padding: 0.7rem 1.2rem; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem;">
            Save Changes
        </button>
    </form>

    <script>
        const imageInput = document.getElementById('image');
        const imagePreview = document.getElementById('image-preview');

        imageInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    imagePreview.setAttribute('src', e.target.result);
                    imagePreview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            } else {
                imagePreview.style.display = 'none';
                imagePreview.setAttribute('src', '');
            }
        });
    </script>
</div>
{% endblock %}
